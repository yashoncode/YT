android.useAndroidX=true
kotlin.code.style=official
# Increase memory for R8/ProGuard and Kotlin compiler daemon
org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m
# 12 logical cores here; 4 left KSP, resource and packaging tasks queuing behind each other.
org.gradle.workers.max=12
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# R8 is 70% of a release build. Measured: forcing its pool to 12 (the logical core count)
# was 13s slower than leaving it alone, so it is left alone.
